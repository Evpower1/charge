<div class="evpc-aside__content evpc-charging-panel" data-ev-scene data-phase="still" data-time="0" data-playing="false" data-wheel-radius="36.3">
  <div class="evpc-scene-heading">
    <p class="evpc-eyebrow">EVPOWER / ELECTRIC MOBILITY</p>
    <h2>Every charge.<br>A new journey.</h2>
    <p class="evpc-scene-intro">Arrive. Recharge. Go further.</p>
  </div>

  <figure class="evpc-scene-stage" aria-label="Electric vehicle charging illustration">
    <div class="evpc-scene-asset-note" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none"><path d="m13 2-9 12h7l-1 8 10-12h-7Z" fill="currentColor"/></svg><span>Powering your journey</span></div>
    <svg class="evpc-scene-svg" viewBox="0 0 640 420" role="img" aria-labelledby="evscene-title evscene-description">
      <title id="evscene-title">The energy to move you forward</title>
      <desc id="evscene-description">A silver electric sedan arrives at a softly lit Evpower charging station, connects, charges and continues its journey.</desc>
      <defs>
        <linearGradient id="evscene-studio" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#0c2944"/><stop offset=".53" stop-color="#0b223b"/><stop offset="1" stop-color="#06172b"/></linearGradient>
        <radialGradient id="evscene-studio-halo"><stop stop-color="#19506b" stop-opacity=".62"/><stop offset=".58" stop-color="#153c58" stop-opacity=".24"/><stop offset="1" stop-color="#0b223b" stop-opacity="0"/></radialGradient>
        <linearGradient id="evscene-floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0e2b43"/><stop offset=".46" stop-color="#0a2036"/><stop offset="1" stop-color="#07192c"/></linearGradient>
        <radialGradient id="evscene-pad"><stop stop-color="#3bd7ef" stop-opacity=".27"/><stop offset=".55" stop-color="#1ab8d7" stop-opacity=".12"/><stop offset="1" stop-color="#1ab8d7" stop-opacity="0"/></radialGradient>
        <linearGradient id="evscene-cable-shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7e9ab2"/><stop offset=".35" stop-color="#273f54"/><stop offset="1" stop-color="#0a1420"/></linearGradient>
        <linearGradient id="evscene-plug-shell" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#526a7f"/><stop offset=".24" stop-color="#253e54"/><stop offset=".65" stop-color="#122737"/><stop offset="1" stop-color="#07131e"/></linearGradient>
        <linearGradient id="evscene-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".38" stop-color="#bbc9d6"/><stop offset=".58" stop-color="#edf3f8"/><stop offset="1" stop-color="#6e859a"/></linearGradient>
        <linearGradient id="evscene-headlight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c3edff" stop-opacity=".34"/><stop offset="1" stop-color="#c3edff" stop-opacity="0"/></linearGradient>
        <filter id="evscene-floor-soft" x="-25%" y="-100%" width="150%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="evscene-led-soft" x="-100%" y="-200%" width="300%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="evscene-port-soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>

        <clipPath id="evscene-rear-rim"><circle cx="414" cy="594" r="114"/></clipPath>
        <clipPath id="evscene-front-rim"><circle cx="1454" cy="594" r="114"/></clipPath>
        <image id="evscene-car-texture" width="1774" height="887" href="{{CAR_ASSET_URL}}"/>
      </defs>

      <rect width="640" height="420" fill="url(#evscene-studio)"/>
      <ellipse cx="363" cy="203" rx="315" ry="206" fill="url(#evscene-studio-halo)"/>
      <path d="M486 0 640 0V293L570 223Z" fill="#2b6b88" opacity=".035"/>
      <path d="M0 342H640V420H0Z" fill="url(#evscene-floor)"/>
      <path d="M0 342H640" stroke="#356079" stroke-opacity=".32" stroke-width=".8"/>
      <ellipse cx="379" cy="351" rx="243" ry="35" fill="#020b13" opacity=".34" filter="url(#evscene-floor-soft)"/>
      <ellipse cx="125" cy="344" rx="46" ry="8" fill="#020b13" opacity=".48" filter="url(#evscene-floor-soft)"/>
      <g data-ev-pad-glow opacity=".32">
        <ellipse cx="377" cy="352" rx="235" ry="38" fill="url(#evscene-pad)"/>
        <path d="M213 352h35m309 0h35" fill="none" stroke="#42cde6" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>
      </g>
      <path d="M73 378c126-15 402-15 519 0" fill="none" stroke="#2b4e66" stroke-width=".6" opacity=".26"/>

      <g class="evpc-scene-charger">
        <image x="54" y="155" width="145" height="193.333333" href="{{CHARGER_ASSET_URL}}"/>
        <g data-ev-charger-glow opacity=".5">
          <ellipse cx="125" cy="343" rx="35" ry="5" fill="#43e0f4" opacity=".13" filter="url(#evscene-led-soft)"/>

          <path d="M115 172h16" stroke="#a1f4ff" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>
        </g>
        <ellipse cx="151" cy="291" rx="3.2" ry="4.6" fill="#06111b" stroke="#455e73" stroke-width=".75"/>
        <path d="m151 290 .5 5" stroke="#1c2e3f" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <g data-ev-car>
        <g transform="translate(160 147) scale(.264938)">
          <use href="#evscene-car-texture"/>
          <g clip-path="url(#evscene-rear-rim)">
            <g data-ev-wheel data-cx="414" data-cy="594"><use href="#evscene-car-texture"/></g>
          </g>
          <g clip-path="url(#evscene-front-rim)">
            <g data-ev-wheel data-cx="1454" data-cy="594"><use href="#evscene-car-texture"/></g>
          </g>
        </g>
        <g data-ev-port-cover opacity="1">
          <rect x="231" y="246" width="18" height="12" rx="3.4" fill="#091a28" stroke="#758ca1" stroke-width=".8"/>
          <ellipse cx="240" cy="252" rx="5.1" ry="4" fill="#030c13" stroke="#385367" stroke-width=".7"/>
          <path d="m230 242 1-7 18 1-1 9Z" fill="url(#evscene-metal)" stroke="#c9d5df" stroke-width=".55"/>
          <path d="m232 237 14 1" stroke="#f6fbff" stroke-width=".8" opacity=".9"/>
        </g>
        <circle cx="240" cy="252" r="10" fill="#3ee9f3" opacity=".23" filter="url(#evscene-port-soft)" data-ev-port-glow/>
        <g data-ev-brake-light opacity="0">
          <path d="m180 248 35 1" stroke="#ff787b" stroke-width="2.3" stroke-linecap="round"/>
          <ellipse cx="198" cy="250" rx="23" ry="3" fill="#ff5f66" opacity=".65" filter="url(#evscene-led-soft)"/>
        </g>
        <g data-ev-lights opacity=".2"><path d="m610 264 87 14v28l-85-32Z" fill="url(#evscene-headlight)"/></g>
      </g>

      <path data-ev-cable d="M151 291C160 339 211 338 223 259" fill="none" stroke="url(#evscene-cable-shine)" stroke-width="5.8" stroke-linecap="round"/>
      <path data-ev-energy d="M151 291C160 339 211 338 223 259" fill="none" stroke="#6ae5f2" stroke-width="1.05" stroke-dasharray="1 15" stroke-linecap="round" opacity=".55"/>
      <g data-ev-plug transform="translate(240 252) rotate(360)" filter="url(#evscene-connector-shadow)">
        <path d="m-19-5 10-1 6 3-1 9-6 1-4 9-6-3 4-11Z" fill="url(#evscene-plug-shell)" stroke="#6a8296" stroke-width=".65"/>
        <path d="m-15 0 5-1 1 4-3 1-3 7-2-1Z" fill="#0a1723"/>
        <path d="M-8-4h4v9h-4Z" fill="#4fc7d7"/>
        <path d="M-4-3h4.8v6H-4Z" fill="url(#evscene-metal)"/>
        <path d="m-18 7-2 2" stroke="#132537" stroke-width="4.5" stroke-linecap="round"/>
        <path d="m-17-4 7-1" stroke="#a0b7c9" stroke-width=".7" opacity=".8"/>
      </g>
    </svg>
    <figcaption class="evpc-scene-meter" aria-label="Illustrated charging status">
      <span class="evpc-scene-status"><span class="evpc-scene-status__dot" aria-hidden="true"></span><span data-ev-status>Charging</span></span>
      <span class="evpc-scene-battery"><span class="evpc-scene-battery__case" aria-hidden="true"><span class="evpc-scene-battery__fill" data-ev-battery style="transform:scaleX(.74)"></span></span><span data-ev-percent>74%</span></span>
    </figcaption>
  </figure>
  <div class="evpc-scene-tools">
    <a class="evpc-qr-download" href="{{QR_PNG_URL}}" download="evpower-contact-qr.png" data-evpc-download-qr><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg>Download QR</a>
    <button type="button" class="evpc-scene-toggle" data-ev-toggle hidden>Pause animation</button>
  </div>
</div>

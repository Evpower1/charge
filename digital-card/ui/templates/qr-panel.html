<aside id="evpc-qr-panel" class="evpc-aside" aria-label="Scannable contact card">
      <div class="evpc-aside__content">
        <p class="evpc-eyebrow">Keep in touch</p>
        <h2>{{QR_LABEL}}</h2>
        <figure class="evpc-qr">
          <div class="evpc-qr__code" role="img" aria-label="{{QR_LABEL}} for {{NAME}}">{{QR_SVG}}</div>
          <figcaption>{{NAME}} <span aria-hidden="true">·</span> {{COMPANY}}</figcaption>
        </figure>
        <p class="evpc-qr-help">Scan with your phone’s camera.</p>
        <a class="evpc-qr-download" href="{{QR_PNG_URL}}" download="evpower-contact-qr.png" data-evpc-download-qr><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg>Download QR</a>
        <span class="evpc-category"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m13 2-9 12h7l-1 8 10-12h-7Z"/></svg>EV charging &amp; mobility</span>
      </div>
    </aside>

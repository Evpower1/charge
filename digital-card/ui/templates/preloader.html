<div class="evpc-preloader" data-evpc-preloader aria-hidden="true" role="status" aria-label="Opening {{COMPANY}} contact card" aria-live="polite">
  <div class="evpc-preloader__inner">
    <div class="evpc-preloader__emblem">
      <img class="evpc-preloader__image" src="{{EMBLEM_URL}}" alt="" width="1254" height="1254" loading="eager" decoding="async" fetchpriority="high">
      <svg class="evpc-preloader__pulse" viewBox="0 0 1254 1254" aria-hidden="true" focusable="false">
        <path d="M 340 710 H 560 Q 595 710 610 680 L 687 535 L 724 784 L 780 670 Q 793 646 820 646 H 943"/>
        <g class="evpc-preloader__contacts">
          <circle cx="994" cy="615" r="14"/><circle cx="1046" cy="615" r="14" style="animation-delay:.075s"/><circle cx="1098" cy="615" r="14" style="animation-delay:.15s"/>
          <circle cx="994" cy="672" r="14" style="animation-delay:.225s"/><circle cx="1046" cy="672" r="14" style="animation-delay:.3s"/><circle cx="1098" cy="672" r="14" style="animation-delay:.375s"/>
        </g>
      </svg>
    </div>
    <div class="evpc-preloader__track" aria-hidden="true"><span></span></div>
    <p class="evpc-preloader__caption">{{TAGLINE}}</p>
  </div>
  <button type="button" class="evpc-preloader__skip" data-evpc-preloader-skip>Skip animation</button>
</div>
